name: guardpost
description: GuardPost - Personal Digital Security Control Center
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.2
  firebase_core: ^2.27.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  purchases_flutter: ^6.28.0
  flutter_local_notifications: ^17.0.0
  crypto: ^3.0.3
  local_auth: ^2.1.8
  permission_handler: ^11.3.0
  intl: ^0.19.0
  google_fonts: ^6.2.0
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  fonts:
    - family: GoogleFonts
      fonts:
        - asset: packages/google_fonts/fonts/Inter-Regular.ttf
