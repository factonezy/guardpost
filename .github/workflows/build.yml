name: Build GuardPost APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze

      - name: Build APK (Release)
        run: flutter build apk --release --split-per-abi --dart-define=SAFE_BROWSING_API_KEY=${{ secrets.SAFE_BROWSING_API_KEY }}

      - name: Build APK (Universal)
        run: flutter build apk --release --dart-define=SAFE_BROWSING_API_KEY=${{ secrets.SAFE_BROWSING_API_KEY }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: guardpost-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Build App Bundle
        run: flutter build appbundle --release --dart-define=SAFE_BROWSING_API_KEY=${{ secrets.SAFE_BROWSING_API_KEY }}

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: guardpost-release-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
